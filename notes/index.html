
<!DOCTYPE html>
<html lang="en">        <!--The <html> HTML element represents the root (top-level element)
                        of an HTML document, so it is also referred to as the root element. 
                        All other elements must be descendants of this element. There can be only one <html>
                        element in a document.-->

                        
<head>                  <!--The <head> HTML element contains machine-readable information (metadata) about 
                        the document,like its title, scripts, and style sheets.
                        There can be only one <head> element in an HTML document.-->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>                 
<body>                   <!--The <body> HTML element represents the content of an HTML document.
                        There can be only one <body> element in a document.-->

    <H1>DISHA SINGH</H1>                          



                                <!--The <h1> to <h6> HTML elements represent six levels of section headings.
                                <h1> is the highest section level and <h6> is the lowest. By default,
                                all heading elements create a block-level box in the layout,
                                starting on a new line and taking up the full width available in their
                                containing block.-->
                                

    <P>This is Disha Singh ,BTech cse Second year Student at GAUTAM BUDDHA UNIVERSITY.</P>


    <!--The <p> HTML element represents a paragraph.
    Paragraphs are usually represented in visual media as blocks of text separated from adjacent
    blocks by blank lines and/or first-line indentation, but HTML paragraphs can be any structural
    grouping of related content, such as images or form fields.
    Paragraphs are block-level elements, and notably will automatically close if another block-level
    element is parsed before the closing </p> tag. See "Tag omission" below.-->
</body>
</html>
